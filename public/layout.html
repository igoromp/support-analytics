<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}} · Support Analytics</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23131F33'/%3E%3Cpath d='M8 20l5-5 4 3 7-8' stroke='%23E0662E' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/public/base.css">
</head>
<body>
  <aside class="sidebar">
    <a href="/" class="brand">
      <span class="brand-mark">
        <svg width="22" height="22" viewBox="0 0 32 32"><path d="M6 22l6-6 5 4 9-10" stroke="#E0662E" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="brand-name">Support<em>Analytics</em></span>
    </a>
    <nav class="nav">{{NAV_ITEMS}}</nav>
    <div class="sidebar-foot"><code>support-analytics v1.0</code></div>
  </aside>
  <main class="main">
    <header class="page-header">
      <div class="page-header-text">
        <h1>{{MODULE_TITLE}}</h1>
        <p class="page-desc">{{MODULE_DESCRIPTION}}</p>
      </div>
      <div class="page-header-right">
        <code class="module-id">{{MODULE_ID}}</code>
        {{DOC_LINK}}
      </div>
    </header>
    <div class="content">{{CONTENT}}</div>
  </main>
  <div id="toasts" aria-live="polite"></div>
  <script src="/public/shell.js"></script>
  <script src="/public/components.js"></script>
  {{SCRIPTS}}
</body>
</html>
